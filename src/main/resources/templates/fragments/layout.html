<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Deluxe Eterno, tienda virtual de Trujillo especializada en detalles personalizados, regalos y floristería.">
    <title th:text="${title + ' | Deluxe Eterno'}">Deluxe Eterno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark">DE</span>
            <span>Deluxe Eterno</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbarContent" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/servicios}">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
                <li class="nav-item ms-lg-2"><a class="btn btn-light btn-sm px-3" th:href="@{/contacto}">Hacer consulta</a></li>
            </ul>
        </div>
    </div>
</nav>
<footer th:fragment="footer" class="py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-3 align-items-center">
        <div><strong>Deluxe Eterno</strong><span class="text-white-50"> | Tienda virtual de Trujillo, Perú</span></div>
        <div class="small text-white-50">Detalles personalizados · Regalos · Floristería</div>
        <div class="small text-white-50 d-flex gap-3">
            <a class="text-white-50" href="https://www.instagram.com/deluxeetterno" target="_blank" rel="noopener">Instagram</a>
            <a class="text-white-50" href="https://www.facebook.com/profile.php?id=61550209177936" target="_blank" rel="noopener">Facebook</a>
            <a class="text-white-50" href="https://www.tiktok.com/@deluxeetterno" target="_blank" rel="noopener">TikTok</a>
        </div>
    </div>
</footer>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
